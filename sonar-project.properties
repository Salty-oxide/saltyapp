# SonarQube analysis for Salty.
#
# Coverage is NOT produced by the scanner — it imports LCOV reports that
# `scripts/coverage.sh` generates first (Vitest's v8 provider for the
# frontend, cargo-llvm-cov for the Rust crates). Run that script, then the
# scanner; a scan run on its own reports 0% rather than failing, which reads
# as a coverage regression that isn't one.

sonar.projectKey=salty
sonar.projectName=Salty
# A hand-kept copy of `version` in src-tauri/tauri.conf.json, which is what the
# release workflow reads and what the installer carries. Bump it with that one:
# nothing checks that they agree, and this value sat at 0.55.0 while the app
# shipped 0.97.0, so every analysis in between was filed under the wrong
# release. Override with -Dsonar.projectVersion=... when scanning outside CI.
sonar.projectVersion=1.5.3

sonar.sources=frontend/src,backend,src-tauri/src
sonar.tests=frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

# Rust tests live inside the files they cover (`#[cfg(test)] mod tests`), so
# they cannot be split out via `sonar.tests` the way the frontend's can.
# `backend/*/tests/` holds the integration tests, which can.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  frontend/harness/**

# ---------------------------------------------------------------------------
# Coverage report imports
# ---------------------------------------------------------------------------
# Paths in the frontend report are rewritten to repo-root-relative by
# `scripts/coverage.sh` — Vitest writes them relative to `frontend/`, which
# the scanner (resolving against this file's directory) cannot find.
sonar.javascript.lcov.reportPaths=coverage/frontend.lcov
sonar.rust.lcov.reportPaths=coverage/backend.lcov

# ---------------------------------------------------------------------------
# Excluded from the coverage ratio (still analyzed for bugs and code smells)
# ---------------------------------------------------------------------------
# Each of these is code that cannot be reached by a unit test, so counting it
# would measure the harness rather than the code:
#
# - `src-tauri/**` is the Tauri IPC layer. Its functions are `#[tauri::command]`
#   wrappers that need a running Tauri application (and a desktop toolchain —
#   GTK/WebKit on Linux) to invoke at all; the logic they wrap lives in
#   `backend/*` and is covered there. `src-tauri` is also excluded from the
#   `cargo llvm-cov` run for the same reason, so leaving it in would report it
#   at 0% purely because no report mentions it.
# - `main.tsx` is the React bootstrap (`createRoot(...).render(...)`).
# - `appWindow.ts` and `fonts.ts` wrap Tauri window APIs / browser font
#   enumeration that jsdom does not implement.
# - The integration tests under `backend/*/tests/` are test code themselves.
sonar.coverage.exclusions=\
  src-tauri/**,\
  backend/*/tests/**,\
  frontend/src/main.tsx,\
  frontend/src/lib/appWindow.ts,\
  frontend/src/features/settings/fonts.ts,\
  frontend/src/features/connections/connectionTestFixtures.ts,\
  frontend/src/test-setup.ts

# librdkafka is vendored and built from source; nothing under `target/` is ours.
sonar.cpd.exclusions=**/target/**
