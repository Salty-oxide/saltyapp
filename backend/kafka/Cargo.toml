[package]
name = "salty-kafka"
version = "0.1.0"
edition = "2024"

[dependencies]
salty-core = { workspace = true }
salty-cache = { workspace = true }
error-stack = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
base64 = "0.23"
# Vendored OpenSSL (see `ssl-vendored` below) has no knowledge of any OS's
# certificate trust store — it only knows the path baked in at compile time
# on the CI build machine, which doesn't exist on an end user's machine. This
# reads the *actual* OS trust store (Windows cert store / macOS Keychain /
# Linux's /etc/ssl/certs) at runtime instead, so TLS verification works the
# same way it would for any browser on that machine.
rustls-native-certs = "0.8"

# librdkafka's vendored build has two paths: the default (configure+make,
# Unix-only — no cmake needed) and cmake-build (MSVC+CMake, the only path
# that works on Windows, since Windows has no `configure` shell script
# toolchain by default). Use the lighter default everywhere it works, and
# only pay for cmake on Windows where it's unavoidable.
#
# `ssl-vendored` is required on every platform: SecurityProtocol::Ssl/SaslSsl
# (what virtually every managed cloud Kafka — Confluent Cloud, AWS MSK —
# requires) is silently non-functional without it, since rdkafka-sys passes
# `--disable-ssl` to librdkafka's build unless this feature is enabled.
# Vendored (not plain `ssl`) so OpenSSL is statically linked into the app
# binary rather than dynamically linked against a system OpenSSL install —
# this is a distributed desktop app, and most end-user Windows/macOS
# machines have no system OpenSSL for a dynamic link to find at runtime.
#
# `zstd` is required because librdkafka disables zstd decompression entirely
# unless this feature turns it on — without it, polling a topic whose
# messages were produced with zstd compression (a common choice for
# high-volume/large-payload topics) fails with a client-side "Local: Not
# implemented" error instead of a normal Kafka error, since the consumer
# simply has no code path to decompress the batch. Plain `zstd` (not
# `zstd-pkg-config`) builds libzstd from its bundled C source and statically
# links it in, matching `ssl-vendored`'s rationale above — no system libzstd
# needed on the end user's machine.
# Snappy needs no feature here — it is bundled in librdkafka's own sources —
# but librdkafka's Windows CMake build disables it anyway unless `WITH_SNAPPY`
# is forced on; see build-support/librdkafka-cmake-toolchain.cmake. Whether any
# of this actually took effect is verified by `build_info`'s tests, which ask
# the built library rather than trusting this file.
[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored", "zstd"] }

[target.'cfg(not(windows))'.dependencies]
rdkafka = { version = "0.39", features = ["ssl-vendored", "zstd"] }

[dev-dependencies]
# `tests/live_schema_registry.rs` follows one Avro message the whole way: off
# a real broker through this crate's fetch, into the registry client for its
# schema, and out of the decoder as JSON — the chain `connection_decode_avro`
# performs, which cannot be tested where it lives because `src-tauri` needs a
# desktop toolchain.
salty-schema-registry = { workspace = true }
salty-avro = { workspace = true }
serde_json = { workspace = true }
