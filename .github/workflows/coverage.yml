name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Declared on the job, not on the scan step, and that placement is the
    # whole point. A step's own `env:` block is not in scope for that same
    # step's `if:` — the runner evaluates the condition to decide whether to
    # run the step at all, before it builds the step's environment. So
    # `if: env.SONAR_TOKEN != ''` sitting next to `env: SONAR_TOKEN: ...`
    # always read an undefined value and was always false: the scan never
    # ran, on any branch, including main.
    #
    # The indirection through `env` exists because the `secrets` context is
    # not available to a step-level `if` at all. Job-level `env` is, which is
    # what makes this work.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        # Sonar needs the full history to attribute issues to the commit that
        # introduced them; a shallow clone leaves every line blamed on the
        # merge and breaks the "new code" quality gate.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 24, in step with `release.yml` — and not merely because 20 is old.
      # Node 20 is unsupported by this toolchain: vitest 5 declares
      # `engines.node: ^22.12.0 || ^24.0.0 || >=26.0.0` and jsdom 30
      # `^22.22.2 || ^24.15.0 || >=26.0.0`. The symptom of ignoring that is
      # npm 10.8.2 (the one node 20 ships) crashing in arborist while it
      # resolves vitest's optional peer set — a bare `Cannot read properties
      # of null (reading 'edgesOut')` naming nothing useful, ten seconds into
      # `npm install`, which is exactly how this job was failing. Release was
      # moved off node 20 for this; coverage was not, and kept failing on its
      # own.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      # Pinned to the same version as `rust-toolchain.toml` and
      # `release.yml`, not `@stable`. With a toolchain file in the repo,
      # `@stable` installs `llvm-tools-preview` onto *stable* and then every
      # `cargo` call in the tree is overridden to 1.98.1, which does not have
      # it — so `cargo llvm-cov` is left asking rustup to install the
      # component it was supposed to already have.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # librdkafka is built from source (configure+make) with vendored OpenSSL
      # and zstd — see backend/kafka/Cargo.toml. GTK/WebKit are deliberately
      # absent: `src-tauri` is not built here, only the backend crates.
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Run as a plain container rather than a `services:` entry: the fixture
      # script drives Kafka's own CLI tools through `docker exec`, which a
      # service container does not expose.
      - name: Start Kafka
        run: docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.0

      - name: Load e2e fixtures
        run: ./scripts/e2e-fixtures.sh

      # Without the broker the e2e tests skip themselves and `client.rs` — the
      # largest file in the backend — drops from ~94% to ~62%, since every
      # rdkafka success path is unreachable without one.
      - name: Generate coverage
        env:
          SALTY_E2E_BOOTSTRAP: localhost:9092
        run: ./scripts/coverage.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

      # Skipped rather than failed when the token is not configured, so forks
      # and PRs from them still get the coverage run above. The token comes
      # from the job-level `env` above — see the note there for why it cannot
      # be declared on this step.
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

      - name: Stop Kafka
        if: always()
        run: docker rm -f kafka || true
