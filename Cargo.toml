[workspace]
resolver = "2"
members = [
  "backend/core",
  "backend/db",
  "backend/kafka",
  "backend/avro",
  "backend/protobuf",
  "backend/schema-registry",
  "backend/ksql",
  "src-tauri",
]

[workspace.dependencies]
error-stack = "0.8"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps `serde_json::Value::Object` in insertion order
# (IndexMap) instead of sorting keys (BTreeMap). Decoded Avro records are
# built in schema field order, and that is the order the payload viewer
# must show — alphabetising a record silently reorders every message the
# user opens. Nothing here depends on keys being sorted: every other
# `serde_json` use in the workspace serialises a `#[derive(Serialize)]`
# struct, whose order comes from the struct, not the map.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
async-trait = "0.1"
salty-core = { path = "backend/core" }
salty-db = { path = "backend/db" }
salty-kafka = { path = "backend/kafka" }
salty-avro = { path = "backend/avro" }
salty-protobuf = { path = "backend/protobuf" }
salty-schema-registry = { path = "backend/schema-registry" }
salty-ksql = { path = "backend/ksql" }

# Release builds had no profile at all, so they ran on cargo's defaults:
# `codegen-units = 16` (which deliberately trades optimization quality for
# parallel compile speed) and no LTO, meaning nothing was ever inlined or
# specialized across crate boundaries — every call from `src-tauri` into
# `salty-kafka`, and from there into rdkafka, stayed an opaque function
# call. For a desktop app that is built once by CI and then run for hours by
# every user, that is the wrong side of the trade: compile time is paid once
# on a build machine, runtime is paid continuously on the user's.
#
# `panic` is deliberately left at the default `unwind`. Several paths here
# depend on catching a panic rather than dying on it: every
# `spawn_blocking` call site turns a panicking task back into an
# `AppError` (see `fetch_messages`'s "task panicked" attachment), and the
# pooled-client mutexes recover from poisoning via
# `unwrap_or_else(|err| err.into_inner())`. `panic = "abort"` would turn any
# one of those into an immediate process kill, losing the user's session —
# a behaviour change, not an optimization.
#
# `strip = "debuginfo"` rather than `"symbols"`: it removes the bulk without
# reducing panic messages and `error-stack` backtraces to bare addresses,
# which is what the Logs panel surfaces when something fails on a user's
# machine.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
