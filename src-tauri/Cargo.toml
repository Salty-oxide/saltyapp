[package]
name = "salty-app"
version = "0.1.0"
# Deliberately still 2021 while every `backend/*` crate is on 2024. Editions
# are per-crate and mix freely, and this is the one crate that cannot be
# compiled in every environment the workspace is developed in (it needs GTK
# and pkg-config). Migrating it means running `cargo fix --edition` somewhere
# it can actually build — the 2024 changes that bit the other crates
# (RPIT lifetime capture, match ergonomics) are exactly the kind that fail to
# compile rather than fail quietly, so doing it blind would break CI.
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
salty-core = { workspace = true }
salty-db = { workspace = true }
salty-kafka = { workspace = true }
salty-avro = { workspace = true }
salty-protobuf = { workspace = true }
salty-schema-registry = { workspace = true }
salty-ksql = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
error-stack = { workspace = true }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
base64 = "0.23"

# Backs `commands::system::trim_process_memory` — trims the OS-visible
# working set after "Clear memory" is clicked, since neither the JS heap
# nor Rust's default allocator eagerly return freed pages to the OS on
# their own. Windows-only: that's the only platform where this was reported
# (Task Manager's "Memory" column specifically reflects the working set).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation"] }
